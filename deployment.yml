apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmyshow-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookmyshow
  template:
    metadata:
      labels:
        app: bookmyshow
    spec:
      containers:
      - name: bookmyshow
        # మార్చాలి: ఇక్కడ మీ డాకర్ హబ్ యూజర్‌నేమ్ ఇవ్వాలి
        image: 232723758111.dkr.ecr.ap-southeast-2.amazonaws.com/bms-ecr/bookmyshow-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bookmyshow-service
spec:
  type: LoadBalancer
  selector:
    app: bookmyshow
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
